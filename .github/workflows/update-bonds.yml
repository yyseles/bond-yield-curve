name: 每周更新保险公司资本补充债/永续债数据

# 【状态同步(主, 每轮必跑)】中债登官方栏目「信息披露>金融债券>付息兑付与行权公告>保险公司资本补充债券」
#   POST https://www.chinabond.com.cn/cbiw/trs/getContentByConditions (parentChnlName=fxdfyxqgg_bxgszbbczq)
#   标题标准写明"赎回选择权行使/不行使" -> 已赎回/存续, 是赎回状态的权威依据; 免登录、无限流、约1分钟跑完。
#   脚本: fix_status_from_chinabond.py (同时修正 5+5年 债 mrtyDate 被错写成第5年的历史错误)
#
# 【新债抓取-上清所(每周固定)】金融债券交易流通要素公告栏目(静态HTML, 覆盖2023-11至今)
#   限流敏感: 高频访问会被软封禁(404), 脚本内置 2.5s 间隔+重试退避, 失败不阻塞主流程。
#   脚本: fetch_shc_newbonds.py (--backfill 一次性回溯全部67页验证历史完整性)
#
# 【新债抓取-货币网(探测)】chinamoney 2026-09-10 起对 CI IP 全站 403;
#   每轮跑 probe_chinamoney.py 单次探测(不重试), 恢复后再手动 mode=bonds 全量抓。
on:
  schedule:
    # 北京时间每周一 19:00 (UTC 11:00)
    - cron: '0 11 * * 1'
  workflow_dispatch:  # 允许手动触发
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'all'
        type: choice
        options:
          - all        # 状态同步 + 上清所新债增量 + 货币网探测 + chinamoney全量尝试
          - notices    # 仅中债登状态同步(约1分钟)
          - bonds      # 状态同步 + 上清所新债增量 + 货币网探测
          - backfill   # 状态同步 + 上清所全历史回溯(一次性, 约8分钟)
          - probe      # 仅连通性自检(约1分钟, 诊断各端点是否可达)

permissions:
  contents: write

jobs:
  update-bonds:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置时区为北京时间
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests openpyxl akshare

      - name: 连通性自检（mode=probe）
        if: github.event.inputs.mode == 'probe'
        continue-on-error: true
        run: |
          python probe_chinamoney.py
          cat connectivity_report.json

      - name: 中债登赎回公告状态同步（权威源, 约1分钟, 每轮必跑）
        if: github.event.inputs.mode != 'probe'
        continue-on-error: true
        run: python fix_status_from_chinabond.py

      - name: 上清所新债增量抓取（每周固定, 限流敏感已内置节奏控制）
        if: github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'notices'
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            python fetch_shc_newbonds.py --backfill
          else
            python fetch_shc_newbonds.py
          fi
        env:
          PYTHONUNBUFFERED: '1'

      - name: 上清所新债报告
        if: github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'notices'
        continue-on-error: true
        run: |
          if [ -f "_shc_report.json" ]; then
            python -c "
          import json
          r=json.load(open('_shc_report.json'))
          print('runAt:', r.get('runAt'), '| mode:', r.get('mode'))
          print('翻页数:', r.get('pagesFetched'), '| 公告总数:', r.get('itemsTotal'), '| 保险类:', r.get('insFound'), '| 被限流:', r.get('blocked'))
          for b in r.get('newBonds', []): print('  新债:', b)
          for e in (r.get('errors') or [])[:10]: print('  ERR:', e)
          "
          fi

      - name: 货币网连通性探测（单次, 检查是否解除封禁）
        if: github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'backfill'
        continue-on-error: true
        run: |
          python probe_chinamoney.py
          python -c "
          import json
          r=json.load(open('connectivity_report.json'))
          ok=[x for x in r['results'] if x['http']==200]
          print('货币网可用端点: %d/%d' % (len(ok), len(r['results'])))
          for x in r['results']: print(' ', x['name'], '->', x['http'])
          "

      - name: 新债全量抓取（仅 mode=all / bonds 手动触发; chinamoney 目前对 CI IP 403）
        if: github.event.inputs.mode == 'all' || github.event.inputs.mode == 'bonds'
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.mode }}" = "bonds" ]; then
            python fetch_ins_bonds.py --no-notices
          else
            python fetch_ins_bonds.py
          fi

      - name: 校验 ins_bonds.json
        continue-on-error: true
        run: |
          if [ -f "ins_bonds.json" ]; then
            SIZE=$(wc -c < "ins_bonds.json")
            echo "ins_bonds.json 大小: $SIZE bytes"
            if [ "$SIZE" -lt 100 ]; then
              echo "⚠ ins_bonds.json 异常（<100B），不提交"
              exit 1
            fi
            python -c "import json; d=json.load(open('ins_bonds.json')); print('债券总数:', d['count'], '| 类型:', sorted(set(b['bondType'] for b in d['bonds'])))"
          else
            echo "⚠ ins_bonds.json 不存在"
            exit 1
          fi

      - name: 输出公告同步报告（诊断用）
        continue-on-error: true
        run: |
          if [ -f "notice_sync_report.json" ]; then
            python -c "
          import json
          r=json.load(open('notice_sync_report.json'))
          print('runAt:', r.get('runAt'))
          print('变更前:', r.get('statusBefore'))
          print('变更后:', r.get('statusAfter'))
          for k in ('notices','payments'):
              s=r.get(k,{})
              print(f\"[{k}] 公告数={s.get('count')} 被限流={s.get('blocked')} 变更={len(s.get('changed',[]))} 跳过={len(s.get('skipped',[]))}\")
              for c in s.get('changed',[]): print('   CHG', c)
              for t in (s.get('skipped') or [])[:15]: print('   SKIP', t)
          "
          else
            echo "无 notice_sync_report.json（本轮未跑公告同步）"
          fi

      - name: 提交并推送更新
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ins_bonds.json notice_sync_report.json connectivity_report.json _shc_report.json
          if git diff --cached --quiet; then
            echo "ins_bonds.json 无变化，跳过提交"
          else
            git commit -m "自动更新资本补充债/永续债数据: $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✓ 资本补充债/永续债数据更新完成"
          fi
