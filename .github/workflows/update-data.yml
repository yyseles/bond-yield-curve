name: 每日自动更新国债利率数据并部署

on:
  schedule:
    # 北京时间 17:45 (UTC 09:45) —— 第一次尝试，提前于中债网常规发布时间
    - cron: '45 9 * * *'
  workflow_dispatch:  # 允许手动触发
  push:               # 每次推送也自动部署
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置时区为北京时间
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests openpyxl

      - name: 循环抓取（最多5次，间隔25分钟）
        id: fetch_loop
        run: |
          MAX_ATTEMPTS=5
          INTERVAL_SEC=1500  # 25分钟 = 1500秒
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== 第 $attempt / $MAX_ATTEMPTS 次尝试 ==="
            # 先检查今天是否已更新（可能前一次已成功）
            if python ci_update.py --check-today; then
              echo "今天已更新，无需继续"
              echo "updated=true" >> $GITHUB_OUTPUT
              break
            fi
            # 执行抓取
            python ci_update.py
            # 再次检查是否更新成功
            if python ci_update.py --check-today; then
              echo "本次抓取成功"
              echo "updated=true" >> $GITHUB_OUTPUT
              break
            fi
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "未获取到今天数据，等待 ${INTERVAL_SEC} 秒后重试..."
              sleep $INTERVAL_SEC
            else
              echo "⚠ 已达最大重试次数，今天数据仍未获取"
              echo "updated=false" >> $GITHUB_OUTPUT
            fi
          done

      - name: 提交并推送更新（含 keepalive 保活）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 由 ci_update.py 的 DATA_SOURCES 注册表驱动 git add
          FILES=$(python -c "import ci_update; print(' '.join(ci_update.COMMIT_FILES))")
          for f in $FILES; do git add "$f" 2>/dev/null || true; done
          echo "已暂存注册表文件: $FILES"
          if git diff --cached --quiet; then
            echo "数据无变化，检查是否需要 keepalive 保活..."
            LAST_COMMIT_TS=$(git log -1 --format="%ct")
            NOW_TS=$(date +%s)
            DIFF_HOURS=$(( (NOW_TS - LAST_COMMIT_TS) / 3600 ))
            echo "距上次提交: ${DIFF_HOURS} 小时"
            if [ "$DIFF_HOURS" -gt 23 ]; then
              echo "超过23小时无提交，执行 keepalive 保活..."
              git commit --allow-empty -m "keepalive: $(date +'%Y-%m-%d %H:%M') 保活提交"
              git push
              echo "✓ keepalive 保活完成"
            else
              echo "无需保活"
            fi
          else
            echo "有新的数据更新，正在提交..."
            git commit -m "自动更新数据: $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✓ 数据更新完成"
          fi

      - name: 设置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 数据源时效性自检（落后即告警）
        run: python ci_update.py --self-check
